name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
