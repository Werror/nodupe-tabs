name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check tag matches manifest and package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./extension/manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME, manifest $manifest, package.json $pkg must match"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run pack
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "No Dupe Tabs $GITHUB_REF_NAME" --generate-notes --verify-tag
